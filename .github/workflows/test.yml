name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  base:
    name: Base install smoke test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install base package
        run: uv sync --python "${{ matrix.python-version }}"

      - name: Run base import test
        run: uv run --python "${{ matrix.python-version }}" --with pytest pytest tests/test_import.py -q

      - name: Verify optional dependencies are not in the base environment
        run: |
          uv run --python "${{ matrix.python-version }}" python - <<'PY'
          import importlib.util

          for package in ("jax", "matplotlib", "numpyro"):
              assert importlib.util.find_spec(package) is None, package
          PY

  numpyro-cpu:
    name: NumPyro CPU test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install CPU development environment
        run: uv sync --python "${{ matrix.python-version }}" --extra numpyro_cpu --extra dev --extra plotting

      - name: Run tests
        run: uv run --python "${{ matrix.python-version }}" pytest -q

      - name: Benchmark eta2 sqrtlog stress cases
        if: matrix.python-version == '3.12'
        run: JAX_ENABLE_X64=true uv run --python "${{ matrix.python-version }}" python scripts/benchmark_eta2_sqrtlog_stress.py

      - name: Check sigmalos2 accuracy contract
        if: matrix.python-version == '3.12'
        run: JAX_ENABLE_X64=true uv run --python "${{ matrix.python-version }}" python scripts/benchmark_sigmalos2_accuracy_contract.py

      - name: Generate Sérsic visualization
        run: uv run --python "${{ matrix.python-version }}" python scripts/plot_sersic_pr_summary.py artifacts/sersic_deprojection_summary

      - name: Upload Sérsic visualization
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sersic-deprojection-summary-py${{ matrix.python-version }}
          path: |
            artifacts/sersic_deprojection_summary.png
            artifacts/sersic_deprojection_summary.svg
          if-no-files-found: error
