name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  base:
    name: Base install smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install base package
        run: uv sync

      - name: Run base import test
        run: uv run --with pytest pytest tests/test_import.py -q

  numpyro-cpu:
    name: NumPyro CPU test suite
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install CPU development environment
        run: uv sync --extra numpyro_cpu --extra dev

      - name: Run tests
        run: uv run pytest -q
