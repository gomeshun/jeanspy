name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      release_validation:
        description: Run opt-in MCMC tests with both locked and freshly resolved dependencies
        type: boolean
        default: false

env:
  JAX_PLATFORMS: cpu

jobs:
  base:
    name: Base install smoke test (Python ${{ matrix.python-version }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        dependencies: ${{ fromJSON(inputs.release_validation && '["locked", "fresh"]' || '["locked"]') }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install locked base package
        if: matrix.dependencies == 'locked'
        run: uv sync --locked --python "${{ matrix.python-version }}"

      - name: Install base package with fresh dependencies
        if: matrix.dependencies == 'fresh'
        run: |
          uv venv --python "${{ matrix.python-version }}"
          uv pip install .

      - name: Run base import test
        run: uv run --no-sync --with pytest pytest tests/test_import.py -q

      - name: Verify optional dependencies are not in the base environment
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util

          for package in ("jax", "matplotlib", "numpyro"):
              assert importlib.util.find_spec(package) is None, package
          PY

  numpyro-cpu:
    name: NumPyro CPU test suite (Python ${{ matrix.python-version }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        dependencies: ${{ fromJSON(inputs.release_validation && '["locked", "fresh"]' || '["locked"]') }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install locked CPU development environment
        if: matrix.dependencies == 'locked'
        run: uv sync --locked --python "${{ matrix.python-version }}" --extra numpyro_cpu --extra dev --extra plotting

      - name: Install CPU development environment with fresh dependencies
        if: matrix.dependencies == 'fresh'
        run: |
          uv venv --python "${{ matrix.python-version }}"
          uv pip install ".[numpyro_cpu,dev,plotting]"

      - name: Record resolved versions
        run: uv pip freeze > artifacts-dependencies.txt

      - name: Run tests
        env:
          RUN_MCMC: ${{ inputs.release_validation }}
        run: |
          if [ "$RUN_MCMC" = "true" ]; then
            .venv/bin/python -m pytest -q --run-mcmc
          else
            .venv/bin/python -m pytest -q
          fi

      - name: Benchmark eta2 sqrtlog stress cases
        if: matrix.python-version == '3.12'
        run: JAX_ENABLE_X64=true .venv/bin/python scripts/benchmark_eta2_sqrtlog_stress.py

      - name: Check sigmalos2 accuracy contract
        if: matrix.python-version == '3.12'
        run: JAX_ENABLE_X64=true .venv/bin/python scripts/benchmark_sigmalos2_accuracy_contract.py

      - name: Generate Sérsic visualization
        run: .venv/bin/python scripts/plot_sersic_pr_summary.py artifacts/sersic_deprojection_summary

      - name: Run classical inference and restart example
        run: .venv/bin/python scripts/example_classical_inference.py --output-dir "$RUNNER_TEMP/classical-example"

      - name: Upload Sérsic visualization
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sersic-deprojection-summary-py${{ matrix.python-version }}-${{ matrix.dependencies }}
          path: |
            artifacts/sersic_deprojection_summary.png
            artifacts/sersic_deprojection_summary.svg
          if-no-files-found: error

      - name: Upload resolved dependency versions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependencies-py${{ matrix.python-version }}-${{ matrix.dependencies }}
          path: artifacts-dependencies.txt
          if-no-files-found: warn
