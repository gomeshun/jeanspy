name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  base:
    name: Base install smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install base package
        run: uv sync

      - name: Run base import test
        run: uv run --with pytest pytest tests/test_import.py -q

  numpyro-cpu:
    name: NumPyro CPU test suite
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install CPU development environment
        run: uv sync --extra numpyro_cpu --extra dev

      - name: Run tests
        run: uv run pytest -q
