name: Publish release to PyPI

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "README.md"
      - "RELEASE.md"
      - "scripts/validate_release_artifact.py"
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PROJECT_VERSION="$(uv run --isolated --no-project --python 3.12 python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "v${PROJECT_VERSION}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${PROJECT_VERSION}."
            exit 1
          fi

      - name: Build distributions
        run: uv build --no-sources

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Locate built artifacts
        shell: bash
        run: |
          WHEEL="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          SDIST="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$WHEEL"
          test -n "$SDIST"
          WHEEL_URI="$(python -c 'import pathlib, sys; print(pathlib.Path(sys.argv[1]).resolve().as_uri())' "$WHEEL")"
          SDIST_URI="$(python -c 'import pathlib, sys; print(pathlib.Path(sys.argv[1]).resolve().as_uri())' "$SDIST")"
          {
            echo "WHEEL=$WHEEL"
            echo "SDIST=$SDIST"
            echo "WHEEL_URI=$WHEEL_URI"
            echo "SDIST_URI=$SDIST_URI"
          } >> "$GITHUB_ENV"

      - name: Resolve documented optional extras from built artifacts
        shell: bash
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/resolve-env"
          for artifact_uri in "$WHEEL_URI" "$SDIST_URI"; do
            uv pip install --python "$RUNNER_TEMP/resolve-env/bin/python" --dry-run \
              "jeanspy[numpyro_cpu] @ ${artifact_uri}"
            uv pip install --python "$RUNNER_TEMP/resolve-env/bin/python" --dry-run \
              "jeanspy[numpyro_cuda12] @ ${artifact_uri}"
          done

      - name: Validate wheel base runtime
        shell: bash
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-base"
          uv pip install --python "$RUNNER_TEMP/wheel-base/bin/python" "$WHEEL"
          (
            cd "$RUNNER_TEMP"
            PYTHONPATH= "$RUNNER_TEMP/wheel-base/bin/python" \
              "$GITHUB_WORKSPACE/scripts/validate_release_artifact.py" \
              --readme "$GITHUB_WORKSPACE/README.md" \
              --base
          )

      - name: Validate source distribution base runtime
        shell: bash
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/sdist-base"
          uv pip install --python "$RUNNER_TEMP/sdist-base/bin/python" "$SDIST"
          (
            cd "$RUNNER_TEMP"
            PYTHONPATH= "$RUNNER_TEMP/sdist-base/bin/python" \
              "$GITHUB_WORKSPACE/scripts/validate_release_artifact.py" \
              --readme "$GITHUB_WORKSPACE/README.md" \
              --base
          )

      - name: Validate NumPyro CPU runtime from wheel
        shell: bash
        env:
          JAX_PLATFORMS: cpu
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-numpyro-cpu"
          uv pip install --python "$RUNNER_TEMP/wheel-numpyro-cpu/bin/python" \
            "jeanspy[numpyro_cpu] @ ${WHEEL_URI}"
          (
            cd "$RUNNER_TEMP"
            PYTHONPATH= "$RUNNER_TEMP/wheel-numpyro-cpu/bin/python" \
              "$GITHUB_WORKSPACE/scripts/validate_release_artifact.py" \
              --numpyro-cpu
          )

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish to PyPI
        run: uv publish
