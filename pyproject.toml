[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jeanspy"
version = "0.1.0"
description = "Jeans-analysis toolkit for dwarf spheroidal galaxy dynamical modeling and inference"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{ name = "Shunichi Horigome" }]
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = [
    "astrophysics",
    "dwarf spheroidal galaxies",
    "jax",
    "jeans analysis",
    "numpyro",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.12.0",
    "emcee>=3.1.6",
    "h5py>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/gomeshun/jeanspy"
Repository = "https://github.com/gomeshun/jeanspy"
Issues = "https://github.com/gomeshun/jeanspy/issues"
Changelog = "https://github.com/gomeshun/jeanspy/releases"

[project.optional-dependencies]
plotting = [
    "matplotlib>=3.8.0",
]
numpyro_cpu = [
    "arviz[zarr, h5netcdf, netcdf4]>=1.0.0",
    "h5netcdf>=1.4.0",
    "h5py>=3.8.0",
    "netCDF4>=1.6.0",
    "xarray>=2024.11.0",
    "zarr>=2.18.0",
    "jax[cpu]>=0.4.35",
    "numpyro[cpu]>=0.18.0",
]
numpyro_cuda12 = [
    "arviz[zarr, h5netcdf, netcdf4]>=1.0.0",
    "h5netcdf>=1.4.0",
    "h5py>=3.8.0",
    "netCDF4>=1.6.0",
    "xarray>=2024.11.0",
    "zarr>=2.18.0",
    "jax[cuda12]>=0.7.0",
    "numpyro[cuda12]>=0.20.0",
]
dev = [
    "ipykernel",
    "mpmath>=1.3.0",
    "pytest>=9.0.2",
    "seaborn",
    "sympy",
]
benchmark = [
    "adamet>=2.0.10",
    "corner>=2.2.3",
    "dynesty>=3.0.0",
    "jampy>=8.1.4",
    "mgefit>=6.2.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["jeanspy*"]

[tool.setuptools.package-data]
jeanspy = ["data/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "mcmc: slow NumPyro MCMC execution tests; run explicitly with --run-mcmc",
]
